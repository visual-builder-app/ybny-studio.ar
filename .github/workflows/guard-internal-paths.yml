name: Guard internal paths

# هذا المستودع عام: للمجتمع وللامتثال لـ AGPL-3.0 (§13). لا يدخله مستند داخلي
# ولا ملف بيئة؛ تبقى هذه الملفات في مستودع خاص خارج هذا المستودع.
on:
  push:
  pull_request:

jobs:
  guard:
    name: منع المستندات الداخلية وملفات .env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فشل عند وجود مسار داخلي
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)docs/ybny/|(^|/)\.env$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::مسارات داخلية ممنوعة في مستودع عام — احفظها في مستودع خاص خارج هذا المستودع"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK: لا مسارات داخلية ولا ملفات .env في الشجرة."
