name: ybny-accounts-api-local

services:
  api:
    build: .
    image: ybny-accounts-api-local:dev
    container_name: ybny-accounts-api-local
    labels:
      com.ybny.component: accounts-api-local
    # Only loopback publishing: the service is never exposed to the network.
    ports:
      - "127.0.0.1:4000:4000"
    # Run as the invoking host user so the mounted 0600 secret files are readable.
    user: "${YBNY_ACCOUNTS_API_UID:-1000}:${YBNY_ACCOUNTS_API_GID:-1000}"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    environment:
      - PORT=4000
      - ACCOUNTS_DATABASE_URL_FILE=/run/ybny-api-secrets/database-url
      - ACCOUNTS_API_TOKEN_FILE=/run/ybny-api-secrets/service-token
    volumes:
      # Private directory owned by this user (0700) with 0600 secret files.
      - "${YBNY_ACCOUNTS_API_STATE:?run services/accounts-api/runtime.py}:/run/ybny-api-secrets:ro"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1
    mem_limit: 256m
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      # edge is a plain bridge so loopback publishing works; private reaches the
      # internal-only database network. Publishing is impossible on an internal
      # network alone, which is why both are required.
      - edge
      - private

networks:
  edge:
    name: ybny-accounts-api-edge-local
    driver: bridge
  private:
    name: ybny-accounts-private-local
    external: true
